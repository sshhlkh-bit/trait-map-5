        .tg-avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
        .container { background: var(--card); max-width: 450px; width: 100%; border-radius: 24px; padding: 30px; box-shadow: 0 15px 40px rgba(0,0,0,0.05); position: relative; z-index: 10; }
        input { width: 100%; padding: 16px; margin-bottom: 15px; border: 1px solid #DDD; border-radius: 12px; outline: none; background: #F9F9F9; box-sizing: border-box; }
        .btn { background: var(--olive); color: #FFF; border: none; padding: 18px; border-radius: 12px; font-weight: 600; width: 100%; cursor: pointer; }
        .opt-btn { background: #FFF; border: 1px solid #DDD; padding: 14px; border-radius: 12px; margin-bottom: 8px; width: 100%; cursor: pointer; font-size: 15px; }
        .progress-bar { height: 4px; background: #EEE; border-radius: 2px; margin-bottom: 25px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--olive); width: 0%; transition: 0.3s; }
        .q-text { font-size: 19px; font-weight: 500; text-align: center; margin-bottom: 25px; line-height: 1.4; }

</head>

        // E — ЕКСТРАВЕРСІЯ

        { t: "Я віддаю перевагу звичному", c: "O", f: 4, r: true },
        { t: "Мені цікаво пробувати незнайомі речі", c: "O", f: 4, r: false },

        { t: "Я уникаю складних ідей", c: "O", f: 5, r: true },
        { t: "Я люблю інтелектуальні дискусії", c: "O", f: 5, r: false },
        { t: "Мені швидко набридають роздуми", c: "O", f: 5, r: true },
        { t: "Я відкритий(а) до нестандартних поглядів", c: "O", f: 6, r: false },
        { t: "Я віддаю перевагу традиційним підходам", c: "O", f: 6, r: true },
        { t: "Я легко приймаю нові ідеї", c: "O", f: 6, r: false },
        { t: "Мені не подобаються зміни у звичних правилах", c: "O", f: 6, r: true },

        // A — ДОБРОЗИЧЛИВІСТЬ
        { t: "Я зазвичай довіряю людям", c: "A", f: 1, r: false },
        { t: "Я підозріло ставлюся до інших", c: "A", f: 1, r: true },
        { t: "Я вірю у добрі наміри людей", c: "A", f: 1, r: false },

        { t: "Я намагаюся бути чесною(им)", c: "A", f: 2, r: false },

        { t: "Я поводжуся скромно", c: "A", f: 5, r: false },
        { t: "Я люблю бути в центрі захоплення", c: "A", f: 5, r: true },
        { t: "Я співпереживаю людям", c: "A", f: 6, r: false },
        { t: "Я рідко переймаюся чужими почуттями", c: "A", f: 6, r: true },

        { t: "Я залишаюся холодною(им) до емоцій інших", c: "A", f: 6, r: true },

        // C — СВІДОМІСТЬ
        { t: "Я вважаю себе ефективною(им) людиною", c: "C", f: 1, r: false },

        { t: "Я добре справляюся із завданнями", c: "C", f: 1, r: false },
        { t: "Мені бракує впевненості у власній ефективності", c: "C", f: 1, r: true },
        { t: "Я люблю порядок", c: "C", f: 2, r: false },

        { t: "Я люблю діяти спонтанно", c: "C", f: 6, r: true }
    ];

    let cur = 0, uName = "", uPhone = "", answers = [];
    let s = { N:0, E:0, O:0, A:0, C:0 };

    function showN(txt) {
        const n = document.getElementById('tgNotif');
        document.getElementById('tgMsg').innerHTML = txt;
        n.classList.add('active');
        setTimeout(() => n.classList.remove('active'), 8000);
    }

    function startTest() {
        uName = document.getElementById('uName').value;
        uPhone = document.getElementById('uPhone').value;
        if(!uName || !uPhone) return alert("Заповніть дані");
        document.getElementById('step-reg').style.display = 'none';
        document.getElementById('step-test').style.display = 'block';
        showN(`Радий вітати вас, ${uName}. 🙏<br>Цей тест — перший крок до глибокого розуміння себе. Спробуйте відповідати інтуїтивно, перше, що спадає на думку.`);
        render();
    }

    function render() {
        if(cur >= questions.length) return finish();
        const q = questions[cur];
        document.getElementById('pFill').style.width = ((cur / questions.length) * 100) + "%";
        let h = `<div class="q-text">${q.t}</div>`;
        ["Зовсім ні", "Мабуть, ні", "Нейтрально", "Так", "Повністю так"].forEach((o, i) => {
            h += `<button class="opt-btn" onclick="next(${i+1})">${o}</button>`;
        });
        document.getElementById('qArea').innerHTML = h;
    }

    function next(v) {
        const q = questions[cur];
        let score = q.r ? (6 - v) : v;
        s[q.c] += score;
        answers.push(v);
        cur++; render();
        if(cur === 60) showN("Позаду вже половина шляху. Дякую за вашу щирість та фокус. Продовжуємо в тому ж темпі, ви чудово справляєтеся.");
    }

    function getConclusion(scores) {
        let blocks = [];
        
        // N — Нейротизм
        if (scores.N > 85) blocks.push("Емоційна сфера: Ваша нервова система зараз перебуває в стані підвищеної чутливості. Ви дуже глибоко і тонко проживаєте стрес, критику чи внутрішні сумніви, що може виснажувати, але водночас дає вам унікальний рівень емпатії.");
        else if (scores.N < 55) blocks.push("Емоційна сфера: Ви маєте високий рівень емоційної стабільності. Стресові ситуації та зовнішній тиск рідко вибивають вас із колії, ви вмієте зберігати холодний розум та внутрішній спокій у моменти кризи.");
        else blocks.push("Емоційна сфера: У вас помірний та адаптивний рівень чутливості. Ви здатні гостро реагувати на значущі життєві події, проте досить швидко повертаєтеся до психологічної рівноваги.");

        // E — Екстраверсія
        if (scores.E > 85) blocks.push("Взаємодія зі світом: Ви виражений екстраверт. Соціальний контакт, великі компанії та активний обмін емоціями — це ваше головне джерело енергії. Самотність вас швидше пригнічує, ніж відновлює.");
        else if (scores.E < 55) blocks.push("Взаємодія зі світом: Ваша енергія спрямована всередину. Ви цінуєте тишу, глибокі розмови віч-на-віч та свій особистий простір. Відновлення після важких днів для вас можливе лише наодинці з собою.");
        else blocks.push("Взаємодія зі світу: Ви амбіверт — людина золотої середини. Ви легко адаптуєтеся під обставини: можете бути душею компанії, коли це необхідно, але щиро насолоджуєтеся періодами спокійної самотності.");

        // O — Відкритість
        if (scores.O > 85) blocks.push("Мислення та досвід: Ваш розум постійно шукає нові сенси, нестандартні ідеї та естетичний досвід. Ви маєте багату уяву, любите інтелектуальні експерименти та погано переносите рутину й застарілі правила.");
        else if (scores.O < 55) blocks.push("Мислення та досвід: Ви міцно стоїте на землі і керуєтеся прагматизмом. Надаєте перевагу перевіреним фактам, чітким алгоритмам і традиційним підходам. Абстрактні теорії без практичного застосування вам не цікаві.");
        else blocks.push("Мислення та досвід: У вас гармонійно поєднуються творче мислення та здоровий глузд. Ви відкриті до змін та нових знань, але впроваджуєте їх обережно, оцінюючи реальну користь.");

        // A — Доброзичливість
        if (scores.A > 85) blocks.push("Стосунки з людьми: Альтруїзм та щире бажання допомогти — ваші сильні сторони. Ви схильні довіряти оточуючим та шукать компроміси, проте іноді це заважає вам вчасно і жорстко захистити власні кордони.");
        else if (scores.A < 55) blocks.push("Стосунки з людьми: Ви реалістично і подекуди скептично дивитеся на людей. Вмієте конкурувати, чітко бачите маніпуляції та ставите власні інтереси в пріоритет. Завоювати вашу довіру — непросте завдання.");
        else blocks.push("Стосунки з людьми: Ви гнучкі у соціальних зв'язках. Вмієте щиро підтримати та допомогти, коли це доречно, але не дозволяєте сідати собі на голову й здатні дати відсіч у разі потреби.");

        // C — Свідомість
        if (scores.C > 85) blocks.push("Організація життя: Залізна самодисципліна, перфекціонізм та висока відповідальність. Ви ставите амбітні цілі і йдете до них крок за кроком. Для вас важливо тримати все під контролем і доводити справи до ідеалу.");
        else if (scores.C < 55) blocks.push("Організація життя: Ви людина потоку та спонтанності. Жорсткі рамки, графіки і плани вас душать. Ви найкраще дієте в умовах свободи, коли можна гнучко змінювати рішення залежно від внутрішнього настрою.");
        else blocks.push("Організація життя: Ви володієте здоровим балансом між дисципліною та відпочинком. Вмієте мобілізувати сили для важливого проекту, але не схильні заганяти себе в глухий кут тотальним контролем.");

        return blocks.join("\n\n");
    }

    function finish() {
        document.getElementById('step-test').style.display = 'none';
        document.getElementById('step-final').style.display = 'center';
        document.getElementById('step-final').style.display = 'block';
        
        let answersReport = questions.map((q, i) => {
            const options = ["", "Зовсім ні", "Мабуть, ні", "Нейтрально", "Так", "Повністю так"];
            return `${i + 1}. ${q.t}\nВідповідь: ${options[answers[i]] || "Немає відповіді"}`;
        }).join("\n\n");

        const payload = {
            name: uName, 
            phone: uPhone,
            scores: s,
            fullConclusion: getConclusion(s),
            aiSummary: (s.C > 80 ? "Дисциплінований " : "Спонтанний ") + (s.N > 80 ? "Чутливий тип" : "Стабільний тип"),
            facetDetails: "Детальні бали: N:" + s.N + " E:" + s.E + " O:" + s.O + " A:" + s.A + " C:" + s.C,
            answersReport: answersReport
        };

        if(WEBHOOK_URL) {
            fetch(WEBHOOK_URL, { 
                method: "POST", 
                mode: "no-cors", 
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify(payload) 
            });
        }
    }
</script>
