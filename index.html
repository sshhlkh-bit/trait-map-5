    function next(v, txt) {
        const q = questions[cur];
        s[q.c][q.f] += q.r ? (6-v) : v;
        logs.push(`${cur+1}. ${q.t} -> ${txt}`);
        cur++; render();
        if(cur === 60) showN("Половина шляху. Ваша концентрація — запорука точності.");
    }

    function buildArticle() {
        let fullText = "АНАЛІЗ ОСОБИСТОСТІ\n\n";
        ["N","E","O","A","C"].forEach(cat => {
            let sum = Object.values(s[cat]).reduce((a,b)=>a+b);
            let trait = lib[cat] || {t:cat, h:"Високий", l:"Низький"};
            fullText += `--- ${trait.t} ---\n`;
            fullText += (sum >= (questions.length/5)*3 ? trait.h : trait.l) + "\n\n";
        });
        return fullText;
    }

    function finish() {
        document.getElementById('step-test').style.display='none';
        document.getElementById('step-final').style.display='block';
        
        let sums = { 
            N: Object.values(s.N).reduce((a,b)=>a+b),
            E: Object.values(s.E).reduce((a,b)=>a+b),
            O: Object.values(s.O).reduce((a,b)=>a+b),
            A: Object.values(s.A).reduce((a,b)=>a+b),
            C: Object.values(s.C).reduce((a,b)=>a+b)
        };

        fetch(WEBHOOK, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({ 
                name: uName, phone: uPhone, scores: sums,
                fullArticle: buildArticle(),
                allAnswers: logs.join("\n")
            })
        });
    }
</script>
</body>
</html>
