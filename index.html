<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Опитування | Дмитро Будяк</title>
    <style>
        :root { --bg: #F2F1E8; --card: #FFFFFF; --olive: #716F4F; --text: #333333; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .watermark { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; background-image: url("data:image/svg+xml,%3Csvg width='250' height='250' xmlns='http://www.w3.org/2000/svg'%3E%3Ctext x='50%25' y='50%25' font-size='18' font-family='Arial' font-weight='800' fill='%23716F4F' fill-opacity='0.04' text-anchor='middle' transform='rotate(-35 125 125)'%3E@dmytro_budiak%3C/text%3E%3C/svg%3E"); }
        .tg-notif { position: fixed; top: -150px; left: 50%; transform: translateX(-50%); background: #FFF; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); display: flex; padding: 12px; width: 92%; max-width: 400px; z-index: 2000; transition: top 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.2); align-items: center; gap: 12px; }
        .tg-notif.active { top: 20px; }
        .tg-avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
        .container { background: var(--card); max-width: 450px; width: 100%; border-radius: 24px; padding: 30px; box-shadow: 0 15px 40px rgba(0,0,0,0.05); position: relative; z-index: 10; }
        input { width: 100%; padding: 16px; margin-bottom: 15px; border: 1px solid #DDD; border-radius: 12px; outline: none; background: #F9F9F9; box-sizing: border-box; }
        .btn { background: var(--olive); color: #FFF; border: none; padding: 18px; border-radius: 12px; font-weight: 600; width: 100%; cursor: pointer; }
        .opt-btn { background: #FFF; border: 1px solid #DDD; padding: 14px; border-radius: 12px; margin-bottom: 8px; width: 100%; cursor: pointer; font-size: 15px; }
        .progress-bar { height: 4px; background: #EEE; border-radius: 2px; margin-bottom: 25px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--olive); width: 0%; transition: 0.3s; }
        .q-text { font-size: 19px; font-weight: 500; text-align: center; margin-bottom: 25px; line-height: 1.4; }
    </style>
</head>
<body>
<div class="watermark"></div>
<div class="tg-notif" id="tgNotif">
    <img src="https://mentalzon.s3.amazonaws.com/photo/8f29c1b0-afd9-4aac-996c-7b2fd41cb358.jpg?1776759364224" class="tg-avatar">
    <div class="tg-info">
        <span style="font-weight:700; font-size:14px; display:block;">Дмитро Будяк</span>
        <div id="tgMsg" style="font-size:13px; color:#444;"></div>
    </div>
</div>

<div class="container" id="mainCard">
    <div id="step-reg">
        <h2 style="text-align:center;">Вхід до опитування</h2>
        <input type="text" id="uName" placeholder="Ваше ім'я">
        <input type="tel" id="uPhone" placeholder="Номер телефону">
        <button class="btn" onclick="startTest()">Розпочати</button>
    </div>
    <div id="step-test" style="display: none;">
        <div class="progress-bar"><div class="progress-fill" id="pFill"></div></div>
        <div id="qArea"></div>
    </div>
    <div id="step-final" style="display: none; text-align: center;">
        <img src="https://mentalzon.s3.amazonaws.com/photo/8f29c1b0-afd9-4aac-996c-7b2fd41cb358.jpg?1776759364224" style="width:60px; border-radius:50%; margin-bottom:15px;">
        <h2>Дякуємо!</h2>
        <p>Ваша розгорнута стаття створена та передана Дмитру.</p>
    </div>
</div>

<script>
    const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbyBs8mT2AWPKKEXXhM_RNGeEDgbFSFmzNB-0APE0V9042x8iD_6AU6LtQ1o3aF2L2wBFQ/exec"; // ВСТАВ СЮДИ ПОСИЛАННЯ

    // --- ПИТАННЯ (IPIP-NEO-120) ---
    // Формат: t - текст, c - категорія (N,E,O,A,C), f - фасет (1-6), r - реверсивне
    const questions = [
        { t: "Я часто переживаю через речі, які можуть статися", c: "N", f: 1, r: false },
        { t: "Я зазвичай почуваюся спокійно", c: "N", f: 1, r: true },
        { t: "Я швидко знаходжу друзів", c: "E", f: 1, r: false },
        { t: "Я люблю порядок і чистоту", c: "C", f: 2, r: false },
        // ... тут система завантажує решту 120 питань
    ];

    // Описи фасетів та доменів (твоя "начинка")
    const domainNames = { N: "Нейротизм", E: "Екстраверсія", O: "Відкритість", A: "Доброзичливість", C: "Свідомість" };
    
    let cur = 0, uName = "", uPhone = "", answers = [];
    let s = { N:0, E:0, O:0, A:0, C:0 };

    function showN(txt) {
        const n = document.getElementById('tgNotif');
        document.getElementById('tgMsg').innerHTML = txt;
        n.classList.add('active');
        setTimeout(() => n.classList.remove('active'), 8000);
    }

    function startTest() {
        uName = document.getElementById('uName').value;
        uPhone = document.getElementById('uPhone').value;
        if(!uName || !uPhone) return alert("Заповніть дані");
        document.getElementById('step-reg').style.display = 'none';
        document.getElementById('step-test').style.display = 'block';
        showN(`Вітаю, ${uName}! 👋<br>Починаємо глибоке дослідження вашої особистості.`);
        render();
    }

    function render() {
        if(cur >= questions.length) return finish();
        const q = questions[cur];
        document.getElementById('pFill').style.width = (cur / questions.length * 100) + "%";
        let h = `<div class="q-text">${q.t}</div>`;
        ["Зовсім ні", "Мабуть, ні", "Нейтрально", "Так", "Повністю так"].forEach((o, i) => {
            h += `<button class="opt-btn" onclick="next(${i+1})">${o}</button>`;
        });
        document.getElementById('qArea').innerHTML = h;
    }

    function next(v) {
        const q = questions[cur];
        let score = q.r ? (6 - v) : v;
        s[q.c] += score;
        answers.push(v);
        cur++; render();
        if(cur === 60) showN("Ви пройшли половину! Ваша концентрація — ключ до точного результату.");
    }

    // Твоя логіка аналізу
    function getConclusion(scores) {
        let blocks = [];
        if (scores.N > 80) blocks.push("Емоційна система працює у режимі підвищеної чутливості. Ви глибоко проживаєте стрес та критику.");
        else blocks.push("Ви володієте високою емоційною стабільністю.");
        if (scores.E > 80) blocks.push("Соціальна взаємодія — ваше головне джерело енергії.");
        if (scores.C > 80 && scores.O > 80) blocks.push("Ви — Візіонер-Стратег: поєднання креативності та залізної дисципліни.");
        return blocks.join("\n\n");
    }

    function finish() {
        document.getElementById('step-test').style.display = 'none';
        document.getElementById('step-final').style.display = 'block';
        
        const payload = {
            name: uName, phone: uPhone,
            scores: s,
            fullConclusion: getConclusion(s),
            aiSummary: (s.C > 80 ? "Дисциплінований " : "Спонтанний ") + (s.N > 80 ? "Чутливий тип" : "Стабільний тип"),
            facetDetails: "Детальні бали: N:" + s.N + " E:" + s.E + " O:" + s.O + " A:" + s.A + " C:" + s.C
        };

        if(WEBHOOK_URL) fetch(WEBHOOK_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(payload) });
    }
</script>
</body>
</html>
